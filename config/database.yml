development:
  adapter: postgresql
  encoding: unicode
  database: lingolinq-development
  pool: 5
  username: <%= ENV['DB_USER'] || 'postgres' %>
  timeout: 5000
# you
# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  adapter: postgresql
  encoding: unicode
  database: lingolinq-test
  pool: 5
  username: <%= ENV['DB_USER'] || 'postgres' %>
  timeout: 5000

production:
  primary:
    adapter: postgresql
    # GCP Cloud Run reaches Cloud SQL over a unix socket (--set-cloudsql-instances). The socket-form
    # DATABASE_URL (postgres://user:pass@/db?host=/cloudsql/CONN) has an empty host, which uri >= 1.0
    # rejects at boot (URI::InvalidURIError), failing every Rails boot path. So when both DATABASE_URL
    # and LEADER_POSTGRES_URL are blank we configure the connection from discrete env vars instead
    # of a URL. The url branch renders when DATABASE_URL or LEADER_POSTGRES_URL holds a non-blank
    # value (the condition below); otherwise the discrete-var branch renders. The url branch emits
    # DATABASE_URL whenever it is set at all, even blank, so a blank DATABASE_URL beside a valid
    # LEADER_POSTGRES_URL renders an empty url: (config/shards.yml prefers the opposite order).
    # Cloud Run runtime, per read-only `gcloud run ... describe` of every prod and nonprod surface
    # on 2026-09-13 (not derivable from this tree): no Rails-booting surface sets either variable;
    # the four surfaces the deploy workflow manages (web, worker pool, migrate and scheduler Jobs)
    # mount DB_HOST, DB_NAME, DB_USERNAME and DB_PASSWORD from Secret Manager (BOOT_SECRETS in
    # .github/workflows/deploy-cloudrun.yml) and hand-created Jobs that boot Rails mount the same
    # four by hand, so they all take the discrete-var branch. The url branch renders in the
    # runtime-image build (the Dockerfile's assets:precompile step exports a dummy host-form
    # DATABASE_URL under RAILS_ENV=production and boots against it) and in CI and docker-compose,
    # which render it but connect through the test and development blocks below.
    # NOTE: uses plain ERB conditionals (no dash-trim markers) because Rails renders this file with
    # ERB.new(content) and NO trim_mode; dash-trim markers would raise SyntaxError at boot. The
    # control tags sit at column 0 (same as the replica block below) so they render to blank lines
    # that YAML ignores.
    # NOTE: sslmode is inert over a unix socket (libpq ignores it); in-transit encryption to Cloud SQL
    # is provided by the Cloud SQL connector behind --set-cloudsql-instances, not by this value.
<% if ENV['DATABASE_URL'].to_s.strip.empty? && ENV['LEADER_POSTGRES_URL'].to_s.strip.empty? %>
    host: <%= ENV['DB_HOST'] %>
    database: <%= ENV['DB_NAME'] %>
    username: <%= ENV['DB_USERNAME'] %>
    password: <%= ENV['DB_PASSWORD'] %>
    sslmode: <%= ENV['DB_SSLMODE'] || 'disable' %>
<% else %>
    url: <%= ENV['DATABASE_URL'] || ENV['LEADER_POSTGRES_URL'] %>
    sslmode: require
<% end %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
<% if false %>
  # TODO: see shards.yml for examples of how to process follower
  primary_replica: 
    adapter: postgresql
    url: <%= ENV['DATABASE_URL'] || ENV['LEADER_POSTGRES_URL'] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    replica: true
<% end %>
