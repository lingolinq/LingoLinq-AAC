# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  hello: "Hello world"
  write_freeze:
    title: "Temporarily read-only"
    body: "We are finishing some scheduled maintenance, so saving changes is paused for a moment. You can still view and speak your boards. Please try again shortly."
  parental_consent_mailer:
    subject: "Parental consent for a new %{app_name} account"
    greeting: "Hello,"
    intro: "A new %{app_name} account was created for a user who indicated they are under 13. U.S. regulations require verifiable parental consent before the account can be fully activated."
    action_prompt: "If you are the parent or legal guardian, please open the link below to provide consent:"
    privacy_notice: "Before giving consent, please review how we collect, use, and protect your child's information in our Privacy Policy:"
    footer: "If you did not expect this message, you can ignore this email. The account will remain restricted until consent is given or the request expires."
  parental_consent:
    oauth_login_blocked: "This account is waiting for a parent or guardian to approve it before you can sign in here."
    page_title: "Parental consent"
    already_title: "Consent already recorded"
    already_body: "This account has already been approved. No further action is needed."
    thanks_title: "Thank you"
    thanks_body: "Parental consent has been recorded. The account holder can finish setup using the email sent to their address."
    invalid_title: "Link invalid or expired"
    invalid_body: "This consent link is not valid anymore. If you still need to approve an account, ask the registrant to start again or contact support."
    home_link: "%{app_name} home"
  ai_consent_disclosures:
    v1:
      page_title: "AI data-sharing disclosure"
      heading: "What happens when LingoLinq uses AI"
      intro: "This page explains, in plain language, what LingoLinq sends to an outside AI company when your child or the person you support uses an AI-assisted feature, who that AI company is, how long the information is kept, and how to say yes or no. This is separate from the general LingoLinq Privacy Policy, and separate from the consent you give when you sign up."
      consent_required_heading: "AI features need your separate consent"
      consent_required_body: "Nothing described on this page is collected, used, or sent to an AI company unless a parent or guardian has separately agreed to it. You can use the rest of LingoLinq, including boards, sync, messaging, and every non-AI feature, without ever agreeing to this. Saying no to AI data sharing does not affect anything else about the account."
      how_to_consent_heading: "How to give consent"
      how_to_consent_body: "A parent or guardian can give verifiable consent using the method described in the consent request LingoLinq sends (for example, a secure link or a verification step). LingoLinq will not turn on AI features for an account flagged as belonging to a child under 13, and will not send that account's information to an AI company, until that verifiable consent is completed."
      what_we_send_heading: "What information gets sent"
      what_we_send_intro: "Depending on which AI feature is used, LingoLinq may send:"
      what_we_send_item_prediction: "The words and sentences a communicator is actively building, when AI word prediction suggests the next word"
      what_we_send_item_eval: "Clinical evaluation notes and assessment data, only when a speech-language pathologist chooses to generate an AI-drafted evaluation summary for a specific student"
      board_suggestions_note: "AI-assisted board suggestions (for example, typing a topic like \"the zoo\" to get word ideas) are not covered by this consent. LingoLinq automatically removes names and other identifying details from that topic text before it is used, and the topic itself is ordinarily just a subject, not information about your child."
      scrubbing_heading: "We filter what we can before sending it"
      scrubbing_body: "Before any of the above is sent to an AI company, LingoLinq automatically removes common identifying details it can detect, such as names, email addresses, phone numbers, and account identifiers. This filter is not perfect. Free-typed text may still contain identifying details the filter does not catch. We describe this as \"scrubbed\" or \"pseudonymized\" data. It is not the same as the formal legal standard for fully removing all identifying information, because the underlying record can still be linked back to your account inside LingoLinq's own systems."
      who_we_send_to_heading: "Who receives this information"
      who_we_send_to_intro: "LingoLinq's AI features are built on the following companies and models. This list is kept current; if it changes in a way that matters, we will show you this page again and ask for consent again before the change takes effect."
      vendor_purpose_board: "board suggestions"
      vendor_purpose_prediction: "word prediction"
      vendor_purpose_eval: "evaluation narration"
      training_confirmed_zdr: "LingoLinq operates under a zero-data-retention agreement with this company for these specific models. That means this company does not keep the information after answering the request, and does not use it to train its own AI models."
      training_unconfirmed: "This company is used only as an automatic backup if the first company above is unavailable. LingoLinq has not yet confirmed this backup company's data-handling terms, so we cannot yet make the same no-training, no-retention promise for this backup path. The same filtering described above still applies before anything is sent."
      retention_heading: "How long this information is kept"
      retention_vendor_intro: "The AI company itself: covered above, next to each company's name."
      retention_lingolinq_intro: "LingoLinq's own copy of a summary of each AI request, kept for auditing:"
      retention_eu: "For accounts in the European Union: up to 5 years, which is already in effect."
      retention_children: "For accounts belonging to a child under 13: a rolling 12 months, independent of whether the account stays open or closed. This window has been decided and is being put into effect."
      retention_general: "For all other accounts: 24 months. This window has been decided and is being put into effect."
      retention_ip: "The IP address on any AI request record is removed after 90 days for every account. This is already in effect today."
      retention_account_deletion: "If the account itself is deleted, the AI request records tied to it are deleted at the same time. This is already in effect today."
      revocation_heading: "Changing your mind"
      revocation_body: "A parent or guardian, or the account holder once old enough, can withdraw AI data-sharing consent at any time using the method described in your consent request. Once withdrawn, LingoLinq stops sending any further information from that account to any AI company for word prediction or evaluation narration. Withdrawing consent cannot undo or delete anything already sent before the withdrawal; it only stops anything new from being sent. AI-assisted board suggestions are not affected by this and keep working either way. Every other part of LingoLinq keeps working normally without AI features."
      no_consent_heading: "If consent is never given"
      no_consent_body: "If a parent or guardian does not respond to a request for AI data-sharing consent, LingoLinq does not send that account's information to an AI company, and any AI-related information already collected while awaiting consent is deleted within a reasonable time."
      privacy_policy_heading: "Full Privacy Policy"
      privacy_policy_intro: "This page covers AI data sharing only. For everything else LingoLinq collects and how it is protected, read the full"
      privacy_policy_link_text: "LingoLinq Privacy Policy"
      version_footer: "Disclosure version %{version}, effective %{effective_date}."
