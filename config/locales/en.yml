# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  hello: "Hello world"
  write_freeze:
    title: "Temporarily read-only"
    body: "We are finishing some scheduled maintenance, so saving changes is paused for a moment. You can still view and speak your boards. Please try again shortly."
  parental_consent_mailer:
    subject: "Parental consent for a new %{app_name} account"
    greeting: "Hi there!"
    intro: "A new %{app_name} account was just created by someone in your care, and the user let us know they are under %{consent_age}."
    offboarding_intro: "A school or district recently released a %{app_name} account for someone in your care who is under %{consent_age}. To keep using the account as a family account, we need parental consent."
    safety_notice: "To keep things safe and follow U.S. regulations, we need a thumbs-up from a parent or guardian before we can fully activate the account."
    ready_heading: "Ready to approve?"
    action_prompt: "If you are their parent or legal guardian, you can easily give your consent by clicking the link below:"
    cta_label: "Approve Account & Get Started"
    privacy_notice: "Before you do, feel free to take a quick look at our Privacy Policy to see exactly how we collect, use, and protect your child's information."
    privacy_link_label: "Privacy Policy"
    decline_heading: "Prefer not to continue?"
    decline_prompt: "If you do not want this account to continue, you can decline. We will permanently delete the account."
    offboarding_decline_prompt: "If you do not want this account to continue, you can decline. We will prepare an export of the account data when available, then permanently delete the account."
    decline_cta_label: "Decline and request deletion"
    unexpected_heading: "Didn't expect this email?"
    footer: "No worries! If this wasn't you, you can simply ignore this message. The account will stay locked and restricted until a parent approves it, or the request eventually expires."
    offboarding_footer: "If nobody responds before the request expires, we will prepare an export of the account data when available and then permanently delete the account."
  parental_consent_offboarding_export_mailer:
    subject: "Account export and scheduled deletion for %{app_name}"
    greeting: "Hi there!"
    intro: "Because parental consent was declined or the consent window expired for the %{app_name} account %{child_username}, we prepared an export of the account data (when available) and scheduled the account for permanent deletion."
    export_prompt: "You can download the export here (link expires):"
    export_cta_label: "Download account export"
    export_unavailable: "We were unable to attach a downloadable export link. Please contact support if you need a copy of the data before deletion."
    deletion_notice: "Permanent deletion is scheduled for %{deletion_at}."
    footer: "If you have questions, contact us right away."
    contact_link_label: "Contact Page"
    privacy_link_label: "Privacy Policy"
  parental_consent_confirmation_mailer:
    subject: "Parental consent confirmed for %{app_name}"
    greeting: "Hi there!"
    intro: "Just a quick heads-up to confirm that you've approved the %{app_name} account for %{child_username} (registered on %{registered_at}). We've got your consent officially locked in!"
    privacy_notice: "By giving the green light, you agreed to our Privacy Policy, which explains how we collect, use, and protect your child's info."
    privacy_link_label: "Privacy Policy"
    revoke_heading: "Changed your mind? No worries!"
    revoke_notice: "You can withdraw your consent at any time. Just keep in mind that if you do, their account will be locked, and they won't be able to log back in until you approve it again."
    revoke_prompt: "To withdraw consent, just click here:"
    revoke_cta_label: "Revoke Consent"
    footer: "If you didn't authorize this account or have any questions at all, please let us know right away at our Contact Page. We're here to help!"
    contact_link_label: "Contact Page"
  parental_consent_revoked_mailer:
    subject: "Parental consent withdrawn for %{app_name}"
    greeting: "Hi there!"
    intro: "Just a quick note to confirm that you've withdrawn your parental consent for a %{app_name} account."
    details: "Account: %{child_name} (username: %{child_username}). Consent was withdrawn on %{revoked_at}. The account is now restricted."
    footer: "If you didn't mean to withdraw consent or have any questions at all, please let us know right away at our Contact Page. We're here to help!"
    contact_link_label: "Contact Page"
  parental_consent:
    oauth_login_blocked: "This account is waiting for a parent or guardian to approve it before you can sign in here."
    oauth_login_revoked: "A parent or guardian withdrew consent for this account. It cannot be used until consent is given again."
    page_title: "Parental consent"
    already_title: "Consent already recorded"
    already_body: "This account has already been approved. No further action is needed."
    thanks_title: "Thank you"
    thanks_body: "Parental consent has been recorded. The account holder can finish setup using the email sent to their address."
    invalid_title: "Link invalid or expired"
    invalid_body: "This consent link is not valid anymore. If you still need to approve an account, ask the registrant to start again or contact support."
    revoke_already_title: "Consent already withdrawn"
    revoke_already_body: "Parental consent for this account was already withdrawn. No further action is needed."
    revoke_thanks_title: "Consent withdrawn"
    revoke_thanks_body: "Your withdrawal has been recorded. The account is now restricted and the child cannot sign in."
    revoke_invalid_title: "Link invalid"
    revoke_invalid_body: "This withdrawal link is not valid anymore. If you need to withdraw consent, contact support."
    decline_confirm_title: "Confirm you want to decline"
    decline_confirm_body: "Declining means we will permanently delete this account and everything in it, including saved boards and recorded sounds. This cannot be undone. Nothing has changed yet."
    offboarding_decline_confirm_body: "Declining means we will prepare an export of the account data and then permanently delete the account, including saved boards and recorded sounds. This cannot be undone. Nothing has changed yet."
    decline_confirm_button: "Decline and delete the account"
    decline_already_title: "Decline already recorded"
    decline_already_body: "This consent request was already declined. The account is scheduled for deletion."
    offboarding_decline_already_body: "This consent request was already declined. The account is scheduled for export and deletion when applicable."
    decline_thanks_title: "Consent declined"
    decline_thanks_body: "Your decline has been recorded. We will permanently delete the account."
    offboarding_decline_thanks_body: "Your decline has been recorded. We will prepare an export of the account data when available and then permanently delete the account."
    decline_invalid_title: "Link invalid or expired"
    decline_invalid_body: "This decline link is not valid anymore. If you need help, contact support."
    home_link: "%{app_name} Home"
  consent_nav:
    # logo_alt is no longer used — the brand name is resolved per-domain from
    # current_domain.app_name so white-labeled installs don't announce "LingoLinq".
    # Kept so any cached/translated copies don't 500 on a missing key.
    logo_alt: "LingoLinq"
    nav_label: "Site"
    demo: "Try a Demo"
    features: "Features"
    about: "About"
    beta_feedback: "Beta feedback"
    # sign_in / try_free are no longer rendered on the consent pages (conversion
    # CTAs don't belong on a legal consent confirmation). Kept for the same reason.
    sign_in: "Sign In"
    try_free: "Try Free"
  eu_ai_parental_consent_mailer:
    subject: "Consent needed before AI features for a %{app_name} account"
    greeting: "Hello,"
    intro: "A %{app_name} account for someone under 16 in your care requested permission to use optional AI-assisted features. Parental consent is required before those AI features can be turned on."
    aac_notice: "Core communication tools (boards, speak mode, and other non-AI features) remain available without this consent."
    action_prompt: "If you are the parent or legal guardian and agree to allow AI features for this account, please open the link below:"
    privacy_notice: "Before giving consent, please review how we handle information in our Privacy Policy:"
    footer: "If you did not expect this message, you can ignore this email. AI features will stay off until consent is given or the request expires."
  eu_ai_parental_consent_confirmation_mailer:
    subject: "AI feature consent confirmed for %{app_name}"
    greeting: "Hello,"
    intro: "This message confirms that you approved optional AI features for a %{app_name} account. Your consent has been recorded, and the AI features they requested are now turned on."
    details: "Account: %{child_name} (username: %{child_username}). Consent recorded on %{granted_at}."
    privacy_notice: "You can review our Privacy Policy, which describes how we collect, use, and protect information:"
    revoke_notice: "You may withdraw this AI consent at any time. If you withdraw consent, AI features will be turned off for the account. Core AAC tools without AI remain available."
    revoke_prompt: "To withdraw AI consent, open this link:"
    footer: "If you did not approve this or have questions, please contact us at %{contact_url}."
  eu_ai_parental_consent_revoked_mailer:
    subject: "AI feature consent withdrawn for %{app_name}"
    greeting: "Hello,"
    intro: "This message confirms that you withdrew consent for optional AI features on a %{app_name} account."
    details: "Account: %{child_name} (username: %{child_username}). Consent withdrawn on %{revoked_at}. AI features are now turned off."
    aac_notice: "Core communication tools (boards, speak mode, and other non-AI features) remain available."
    footer: "If you did not withdraw consent or have questions, please contact us at %{contact_url}."
  eu_ai_parental_consent:
    page_title: "AI feature parental consent"
    already_title: "Consent already recorded"
    already_body: "AI feature consent for this account has already been approved. No further action is needed."
    thanks_title: "Thank you"
    thanks_body: "Your consent for optional AI features has been recorded. The AI features they requested are now turned on for their account."
    invalid_title: "Link invalid or expired"
    invalid_body: "This consent link is not valid anymore. If you still need to approve AI features, ask the account holder to send a new request from Preferences, or contact support."
    revoke_already_title: "Consent already withdrawn"
    revoke_already_body: "AI feature consent for this account was already withdrawn. No further action is needed."
    revoke_thanks_title: "Consent withdrawn"
    revoke_thanks_body: "Your withdrawal has been recorded. Optional AI features are turned off for this account. Core AAC tools remain available."
    revoke_invalid_title: "Link invalid"
    revoke_invalid_body: "This withdrawal link is not valid anymore. If you need to withdraw AI consent, contact support."
    home_link: "%{app_name} Home"
  ai_consent_disclosures:
    v1:
      page_title: "AI data-sharing disclosure"
      heading: "What happens when LingoLinq uses AI"
      intro: "This page explains, in plain language, what LingoLinq sends to an outside AI company when your child or the person you support uses an AI-assisted feature, who that AI company is, how long the information is kept, and how to say yes or no. This is separate from the general LingoLinq Privacy Policy, and separate from the consent you give when you sign up."
      consent_required_heading: "AI features need your separate consent"
      consent_required_body: "Nothing described on this page is collected, used, or sent to an AI company unless a parent or guardian has separately agreed to it. You can use the rest of LingoLinq, including boards, sync, messaging, and every non-AI feature, without ever agreeing to this. Saying no to AI data sharing does not affect anything else about the account."
      how_to_consent_heading: "How to give consent"
      how_to_consent_body: "A parent or guardian can give verifiable consent using the method described in the consent request LingoLinq sends (for example, a secure link or a verification step). LingoLinq will not turn on AI features for an account flagged as belonging to a child under 13, and will not send that account's information to an AI company, until that verifiable consent is completed."
      what_we_send_heading: "What information gets sent"
      what_we_send_intro: "Depending on which AI feature is used, LingoLinq may send:"
      what_we_send_item_prediction: "The words and sentences a communicator is actively building, when AI word prediction suggests the next word"
      what_we_send_item_eval: "Clinical evaluation notes and assessment data: nothing is sent today. AI-drafted evaluation narration is currently inactive, and asking for an AI-drafted summary produces a fixed draft written on our own systems that never leaves LingoLinq. If we switch this on, we will name the AI model here first, and it would then apply only when a speech-language pathologist chooses to generate an AI-drafted evaluation summary for a specific student."
      board_suggestions_note: "AI-assisted board suggestions (for example, typing a topic like \"the zoo\" to get word ideas) are not covered by this consent. LingoLinq automatically removes names and other identifying details from that topic text before it is used, and the topic itself is ordinarily just a subject, not information about your child."
      scrubbing_heading: "We filter what we can before sending it"
      scrubbing_body: "Before any of the above is sent to an AI company, LingoLinq automatically removes common identifying details it can detect, such as names, email addresses, phone numbers, and account identifiers. This filter is not perfect. Free-typed text may still contain identifying details the filter does not catch. We describe this as \"scrubbed\" or \"pseudonymized\" data. It is not the same as the formal legal standard for fully removing all identifying information, because the underlying record can still be linked back to your account inside LingoLinq's own systems."
      who_we_send_to_heading: "Who receives this information"
      who_we_send_to_intro: "LingoLinq's AI features are built on the following companies and models. This list is kept current; if it changes in a way that matters, we will show you this page again and ask for consent again before the change takes effect."
      vendor_purpose_board: "board suggestions"
      vendor_purpose_prediction: "word prediction"
      vendor_purpose_eval: "evaluation narration"
      # RETIRED 2026-08-02. The disclosure view no longer selects a canned sentence
      # off `trains_on_data`; it renders each vendor's own `training_note` from
      # LingoLinq::AiConsentDisclosures, so the page cannot contradict the registry.
      # Kept (not deleted) because other locale files still carry these keys, and
      # rewritten so neither is false if anything reaches them: the ZDR promise is
      # NOT true on the Bedrock path (AWS may retain for abuse prevention), and the
      # "automatic backup" vendor described below has not existed since 2026-07-09.
      training_confirmed_zdr: "See the note next to each company above for how that company handles this information."
      training_unconfirmed: "See the note next to each company above for how that company handles this information."
      retention_heading: "How long this information is kept"
      retention_vendor_intro: "The AI company itself: covered above, next to each company's name."
      retention_lingolinq_intro: "LingoLinq's own copy of a summary of each AI request, kept for auditing:"
      retention_eu: "For accounts we have confirmed are in the European Union: a purge at 5 years is scheduled and running, but no record is yet old enough for it to have removed anything. We previously gave the EU AI Act Article 50 as the reason for this window. That was wrong: Article 50 is a transparency rule and sets no record-keeping period. The correct basis, and the length of this window, are under review with our lawyers."
      retention_children: "For accounts belonging to a child under 13: a rolling 12 months, independent of whether the account stays open or closed. This window is decided but is NOT yet in effect. Today these records are removed when the account is deleted, and not before."
      retention_general: "For all other accounts: 24 months. This window is decided but is NOT yet in effect. Today these records are removed when the account is deleted, and not before."
      retention_ip: "The IP address on any AI request record is removed after 90 days for every account. This is already in effect today."
      retention_account_deletion: "If the account itself is deleted, the AI request records tied to it are deleted at the same time. This is already in effect today."
      revocation_heading: "Changing your mind"
      revocation_body: "A parent or guardian, or the account holder once old enough, can withdraw AI data-sharing consent at any time using the method described in your consent request. Once withdrawn, LingoLinq stops sending any further information from that account to any AI company for word prediction or evaluation narration. Withdrawing consent cannot undo or delete anything already sent before the withdrawal; it only stops anything new from being sent. AI-assisted board suggestions are not affected by this and keep working either way. Every other part of LingoLinq keeps working normally without AI features."
      no_consent_heading: "If consent is never given"
      no_consent_body: "If a parent or guardian does not respond to a request for AI data-sharing consent, LingoLinq does not send that account's information to an AI company, and any AI-related information already collected while awaiting consent is deleted within a reasonable time."
      privacy_policy_heading: "Full Privacy Policy"
      privacy_policy_intro: "This page covers AI data sharing only. For everything else LingoLinq collects and how it is protected, read the full"
      privacy_policy_link_text: "LingoLinq Privacy Policy"
      version_footer: "Disclosure version %{version}, effective %{effective_date}."
  art50_disclosures:
    v1:
      page_title: "AI transparency notice"
      heading: "You are interacting with an AI system"
      intro: "Some features in LingoLinq use artificial intelligence. This notice tells you which features use AI, who receives your information when they do, how long records are kept, and how AI-generated output is marked, as required by Article 50(1) of the EU AI Act."
      ai_system_heading: "What this means"
      ai_system_body: "An AI system, in plain language, is software that generates suggestions, drafts, or content on its own, based on a request, rather than following a fixed set of rules written in advance by LingoLinq. When one of the features below is used, the suggestion, word, or draft you see was produced by that kind of system, not typed by a LingoLinq employee."
      features_heading: "Which LingoLinq features use AI"
      features_intro: "This includes AI board generation, which suggests vocabulary words, a board name, and a short description when a new board is created, along with the other AI features listed here."
      who_heading: "Who receives this information"
      who_intro: "LingoLinq's AI features are built on the following company and models."
      marking_heading: "How AI-generated output is marked"
      marking_body: "Output produced by these AI features is marked in a machine-readable way, as required by Article 50(2) of the EU AI Act. This marking always happens for successful AI-generated output. It does not depend on whether you are shown this notice, on your account's jurisdiction, or on any feature setting."
      retention_heading: "How long records are kept"
      retention_vendor_intro: "The AI company itself:"
      retention_lingolinq_intro: "LingoLinq's own record of an AI request, kept separately for auditing, follows a tiered rule rather than one single window:"
      retention_general: "For most accounts: %{months} months. This window is decided but is NOT yet in effect; today these records are removed when the account is deleted. The EU and healthcare rules below can extend it, so it is not a flat rule for every account."
      retention_children: "For accounts belonging to a child under 13: a rolling %{months} months, independent of whether the account stays open or closed. This window is decided but is NOT yet in effect; today these records are removed when the account is deleted. The EU and healthcare rules below can extend it."
      retention_eu: "For accounts in the EU jurisdiction: up to %{years} years. This notice previously presented that window as record-keeping required by the EU AI Act. That was wrong: Article 50 is a transparency rule and imposes no record-keeping period. The basis for this window is under review with our lawyers."
      retention_hipaa: "For accounts linked to a healthcare provider: up to %{years} years. We previously described this as a hard floor required by 45 CFR 164.316(b)(2). That rule requires a covered entity to keep its own written policies and procedures for six years; it is not a rule about how long AI request records must be kept. We are reviewing this window with our lawyers and it may get shorter."
      retention_ip: "The IP address on any AI request record is removed after %{days} days, for every account."
      retention_account_deletion: "The AI request log tied to an account is deleted when the account itself is deleted."
      privacy_heading: "Full Privacy Policy"
      privacy_intro: "This notice covers AI transparency only. For everything else LingoLinq collects and how it is protected, read the full"
      privacy_link_text: "LingoLinq Privacy Policy"
      version_footer: "Disclosure version %{version}, effective %{effective_date}."
