<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Missing-image placeholder. Brand-colored "photo" glyph (smart-blue frame,
       verdigris sun, dusty-denim mountains over a soft denim->verdigris tint) so a
       word-prediction / board button with no symbol reads clearly instead of as a
       faint gray square. Single rounded frame for a sleek, modern look. -->
  <defs>
    <linearGradient id="missing-img-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C86D8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2A9D8F" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect x="14" y="16" width="72" height="68" rx="16" fill="url(#missing-img-fill)" stroke="#3A6BC7" stroke-width="3" stroke-opacity="0.65"/>
  <circle cx="37" cy="39" r="6.5" fill="#2A9D8F"/>
  <path d="M20 78 L42 51 L56 64 L68 52 L80 78 Z" fill="#3A6BC7" fill-opacity="0.82" stroke="#1B365D" stroke-width="1.5" stroke-opacity="0.25" stroke-linejoin="round"/>
</svg>
