# Gitleaks configuration for LingoLinq-AAC.
#
# Extends the full default ruleset and adds ONE narrowly-scoped allowlist for a
# known false positive: gitleaks' `generic-api-key` rule (a long/high-entropy
# string heuristic) matches i18n translation keys/values in the locale files
# (e.g. the `landing_a11y_neurodivergent` accessibility keys), none of which are
# secrets. The allowlist is intentionally narrow:
#   - targetRules = ["generic-api-key"]  -> ONLY that one noisy rule is relaxed;
#     every other rule (AWS keys, private keys, tokens, etc.) STILL scans the
#     locale files.
#   - paths = public/locales/*.json      -> ONLY the translation files are
#     exempted; `generic-api-key` STILL scans the rest of the repository.
title = "LingoLinq-AAC gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "i18n locale strings trip generic-api-key (translation text, not secrets)"
targetRules = ["generic-api-key"]
paths = [
  '''public/locales/.*\.json''',
]

[[allowlists]]
description = "Audit findings register: `ruleKey` values (e.g. cve-braces-2024-4068) are stable finding identifiers, not secrets. The register is mechanically generated and forbids secrets/PII at merge (scripts/audit-merge.rb refuses them; scripts/citation-check.rb keeps it code-only). Same narrow scope as above: only generic-api-key is relaxed, only the generated register artifacts are exempted, every other rule (AWS keys, private keys, tokens) still scans them."
targetRules = ["generic-api-key"]
paths = [
  '''audit-reports/FINDINGS\.json''',
  '''audit-reports/FINDINGS\.md''',
  '''audit-reports/run-log/.*\.jsonl''',
]

[[allowlists]]
description = "i18n translation key 'pin_placeholder_4_digit' (the Speak Mode PIN field placeholder, referenced from pin-settings.hbs and the locale files) trips generic-api-key's high-entropy heuristic because the literal contains 'pin' + a digit. It is an Ember i18n key, not a secret. Narrowest possible scope: matched by the exact key string via regexes (so ONLY that literal is exempted, anywhere it appears) and only generic-api-key is relaxed — every other rule still scans everything, and no other value is allowlisted."
targetRules = ["generic-api-key"]
regexes = [
  '''pin_placeholder_4_digit''',
]

[[allowlists]]
description = "i18n translation key 'trends_explainer2' (the second aggregate-research explainer paragraph on the Trends page, referenced from templates/trends.hbs and the locale files) trips generic-api-key's high-entropy heuristic because the literal ends in a digit. It is an Ember i18n key, not a secret. Same narrowest-possible scope as the pin_placeholder_4_digit entry: matched by the exact key string via regexes (so ONLY that literal is exempted, anywhere it appears) and only generic-api-key is relaxed — every other rule still scans everything, and no other value is allowlisted."
targetRules = ["generic-api-key"]
regexes = [
  '''trends_explainer2''',
]

[[allowlists]]
description = "Landing-page accessibility i18n keys (landing_a11y_*) in Ember templates trip generic-api-key via the same high-entropy heuristic as other translation keys. Locale JSON is already path-allowlisted above; these regexes cover the key= literals in .hbs (and historical templates/components paths). Only generic-api-key is relaxed."
targetRules = ["generic-api-key"]
regexes = [
  '''landing_a11y_meets''',
  '''landing_a11y_neurodivergent''',
  '''landing_a11y_let_us_know''',
]

[[allowlists]]
description = "Rails ActiveSupport duration helpers (N.days.from_now) trip generic-api-key because of digit+entropy heuristics. These are framework APIs used for consent-token expiry, not secrets. Exact-literal regexes only; only generic-api-key is relaxed."
targetRules = ["generic-api-key"]
regexes = [
  '''14\.days\.from_now''',
  '''7\.days\.from_now''',
]

[[allowlists]]
description = "Infra-auditor scan-strategy prose 'Render/AWS/GCP' (cloud provider names) trips generic-api-key. Exact literal only; only generic-api-key is relaxed."
targetRules = ["generic-api-key"]
regexes = [
  '''Render/AWS/GCP''',
  '''Render/GCP''',
]

[[allowlists]]
description = "docs/ROTATING_KEYS.md Stripe rotation verification uses curl -u \"$STRIPE_SECRET_KEY:\" (env-var placeholder, not a real credential). Trips curl-auth-user. Exact literal only; only that rule is relaxed."
targetRules = ["curl-auth-user"]
regexes = [
  '''"\$STRIPE_SECRET_KEY:"''',
]
