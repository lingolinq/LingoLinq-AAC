name: Codex Review Watchdog

# Fail-closed backstop for codex-review.yml (build spec section 1/6,
# resolution to Codex review finding #1: the pipeline must never leave
# codex-review/deep-pass pending forever, because a required status check
# that never resolves blocks merge silently rather than failing loudly).
#
# RECOVERY IS BEST-EFFORT, NOT A 30-MINUTE SLA. See issue #710.
#
# Two triggers, but ONE job and ONE gate. Both triggers run
# `fail-stale-pending`, and the only writer to the stale list is gated on
# `age_min -ge 30`. There is no `github.event_name` branching anywhere in this
# file, so NEITHER trigger provides prompt recovery:
#   1. workflow_run(completed) — codex-review.yml or claude-fix.yml concluded
#      (crashed, cancelled, or exited nonzero) but deep-pass is still pending.
#      This fires immediately and then does NOTHING unless the status is
#      already 30+ minutes old. Do not describe it as a fast path: a run that
#      concluded at the auth step still took 41 minutes to resolve
#      (05:39:18Z pending -> 06:20:56Z failure; see
#      audit-reports/deep-pass-admin-overrides.md). The trigger fired; the age
#      gate is what it waited on.
#   2. schedule — a sweep requested every 10 minutes, subject to the SAME age
#      gate. This is the only trigger that covers a run which hangs forever,
#      because a still-running job emits no workflow_run completion event.
#
# Prompt resolution comes from codex-review.yml's own terminal-status step
# (PR #702), which runs on all exit paths. That is a different mechanism from
# this workflow. Do not credit this workflow with it.
#
# What the 30 minutes does and does not mean:
#   IT IS     the age a pending status must reach before a sweep will fail it.
#   IT IS NOT an upper bound on how long a status can stay pending.
#
# GitHub does not guarantee that scheduled workflows run on time, and under
# load it delays or drops them outright. Observed 2026-07-29 (issue #710): four
# consecutive `*/10` firings were missed, no sweep ran for about 45 minutes, and
# PR #701 sat pending for 77 minutes. Nothing was misconfigured; the cron simply
# did not fire. So the real bound is "at least 30 minutes, plus however long
# GitHub's queue takes", with no ceiling.
#
# This matters in AT LEAST TWO places, not one:
#   a. the status-write-failure path, where codex-review.yml provably cannot
#      resolve its own status because the status API is what is failing;
#   b. a hung `codex exec` — run_model in scripts/codex-review-run-chunks.py
#      passes no timeout= to subprocess.run, so the job stalls to the 90-minute
#      ceiling and emits no workflow_run event while it hangs. This is a known
#      unfixed limit, not a hypothetical.
# In both, this sweep is the only recovery mechanism and its timing is
# unbounded. Everywhere else codex-review.yml's own terminal-status step
# (PR #702) resolves the status and this sweep never needs to act.
#
# There is also no workflow_dispatch trigger here, so there is no operator
# lever to run this on demand and no audited manual path (issue #717).
#
# Do not restate the 30 minutes as a guarantee, an SLA, or a bound anywhere in
# this repository. If a strict bound is ever genuinely required, it needs a
# monitor outside GitHub Actions; scheduling cannot provide one.
on:
  workflow_run:
    workflows: ["Codex Review", "Claude Fix"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"

jobs:
  fail-stale-pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (for the labeling helper script only)
        uses: actions/checkout@v6

      - name: Find open PRs with a pending codex-review/deep-pass status
        id: find_pending
        run: |
          # commit-status API has no "list all pending for context X" endpoint,
          # so we walk open PRs and check each head SHA's status directly.
          #
          # The age anchor is the EARLIEST pending status for the run attempt
          # that is currently in force, not the most recent one.
          # scripts/codex-review-run-chunks.py re-POSTs a `pending` heartbeat as
          # each chunk completes; every heartbeat mints a new status entry with a
          # fresh created_at. Anchoring on the latest entry therefore let a
          # heartbeating run push this clock forward indefinitely and never
          # reach the 30-minute threshold, defeating the backstop in exactly the
          # hang case it exists for. Grouping by target_url (attempt-scoped since the
          # codex-review.yml RUN_URL change) and taking the oldest pending entry
          # in that group measures how long THIS attempt has actually been
          # running, and keeps a re-run from inheriting the prior attempt's clock.
          #
          # Uses the plural /statuses endpoint: /status returns only the latest
          # entry per context and so cannot see the earliest heartbeat.
          gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.sha] | @tsv' > /tmp/open-prs.tsv
          : > /tmp/stale.tsv
          while IFS=$'\t' read -r pr_number head_sha; do
            [ -z "$head_sha" ] && continue
            # `--paginate` emits one JSON array per page, so the raw output is
            # concatenated arrays. `jq -s 'add'` normalizes it to one array and
            # works on every gh version (unlike `--slurp`).
            statuses_json="$(gh api "repos/${{ github.repository }}/commits/${head_sha}/statuses?per_page=100" --paginate 2>/dev/null | jq -s 'add // []' 2>/dev/null || echo '[]')"
            state="$(echo "$statuses_json" | jq -r '
              [ .[] | select(.context == "codex-review/deep-pass") ]
              | sort_by(.created_at) | last | .state // empty
            ')"
            [ "$state" != "pending" ] && continue
            # target_url of the entry currently in force; scope the anchor to it.
            active_url="$(echo "$statuses_json" | jq -r '
              [ .[] | select(.context == "codex-review/deep-pass") ]
              | sort_by(.created_at) | last | .target_url // ""
            ')"
            created_at="$(echo "$statuses_json" | jq -r --arg u "$active_url" '
              [ .[]
                | select(.context == "codex-review/deep-pass"
                         and .state == "pending"
                         and (.target_url // "") == $u)
                | .created_at ]
              | sort | first // empty
            ')"
            [ -z "$created_at" ] && continue
            age_min=$(( ( $(date -u +%s) - $(date -u -d "$created_at" +%s) ) / 60 ))
            # 30 is the ACTION THRESHOLD, not a deadline: a status is eligible to
            # be failed once it is this old. How soon after that a sweep actually
            # runs is up to GitHub's scheduler and is not bounded. See the header.
            if [ "$age_min" -ge 30 ]; then
              printf '%s\t%s\t%s\n' "$pr_number" "$head_sha" "$age_min" >> /tmp/stale.tsv
            fi
          done < /tmp/open-prs.tsv
          cat /tmp/stale.tsv

      - name: Fail stale-pending statuses and label the PR
        run: |
          [ -s /tmp/stale.tsv ] || { echo "No stale pending codex-review/deep-pass statuses."; exit 0; }
          while IFS=$'\t' read -r pr_number head_sha age_min; do
            echo "Failing codex-review/deep-pass on PR #${pr_number} (${head_sha}), pending ${age_min}min"
            gh api "repos/${{ github.repository }}/statuses/${head_sha}" \
              -f state=failure \
              -f context=codex-review/deep-pass \
              -f description="Timed out after ${age_min}min with no result (watchdog)" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh pr edit "$pr_number" --add-label codex-review-failed \
              --repo "${{ github.repository }}" || true
          done < /tmp/stale.tsv
