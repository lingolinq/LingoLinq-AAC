name: Weekly Release PR (staging -> main)

# Opens a release PR from staging into main every Monday morning so the
# release cadence does not depend on someone remembering. Idempotent:
# if a PR is already open from staging into main, the existing one is
# reused and a new comment is added with the current diff. If staging
# is not ahead of main, the workflow exits cleanly.
#
# REQUIRED REPO SECRETS:
#   GOOGLE_CHAT_WEBHOOK_AUTOMATION  -- Google Chat webhook for routine ops notifications
#
# REQUIRED REPO PERMISSIONS (Settings > Actions > General > Workflow permissions):
#   Read and write permissions  (so GITHUB_TOKEN can open PRs)
#
# MANUAL TRIGGER:
#   gh workflow run weekly-release-pr.yml

on:
  schedule:
    # Monday 09:00 America/Los_Angeles == 16:00 UTC year-round during PDT,
    # 17:00 UTC during PST. We pick 16:00 UTC and accept that the message
    # lands at 08:00 PT in winter; close enough for a weekly cadence.
    - cron: '0 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'lingolinq-release-bot'
          git config user.email 'release-bot@lingolinq.com'

      - name: Compute diff staging vs main
        id: diff
        run: |
          git fetch origin main staging
          COMMITS=$(git rev-list --count origin/main..origin/staging)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

          if [ "$COMMITS" = "0" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::staging is not ahead of main, nothing to release"
            exit 0
          fi

          FILES=$(git diff --name-only origin/main..origin/staging | wc -l)
          echo "files=$FILES" >> $GITHUB_OUTPUT

          mkdir -p /tmp/release
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT

          {
            echo "## Release $DATE"
            echo ""
            echo "Auto-generated by .github/workflows/weekly-release-pr.yml"
            echo ""
            echo "**$COMMITS commits, $FILES files changed**"
            echo ""
            echo "### Commits since last release"
            echo ""
            git log origin/main..origin/staging \
              --pretty=format:'- %h %s (@%an)' \
              --no-merges \
              | head -200
            echo ""
            echo ""
            echo "### Verification checklist"
            echo ""
            echo "- [ ] Staging is healthy (no error spikes in Sentry / Render logs)"
            echo "- [ ] CI is green on staging head"
            echo "- [ ] No open compliance / security review on changes in this window"
            echo "- [ ] OK to deploy to production"
          } > /tmp/release/body.md

      - name: Open or update release PR
        id: pr
        if: steps.diff.outputs.no_changes != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE='${{ steps.diff.outputs.date }}'
          EXISTING=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #$EXISTING"
            gh pr edit "$EXISTING" --body-file /tmp/release/body.md
            URL=$(gh pr view "$EXISTING" --json url --jq .url)
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "number=$EXISTING" >> $GITHUB_OUTPUT
            echo "action=updated" >> $GITHUB_OUTPUT
          else
            URL=$(gh pr create \
              --base main \
              --head staging \
              --title "Release $DATE: staging -> main" \
              --body-file /tmp/release/body.md \
              --assignee scotw)
            NUMBER=$(echo "$URL" | sed -E 's|.*/pull/([0-9]+).*|\1|')
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "number=$NUMBER" >> $GITHUB_OUTPUT
            echo "action=opened" >> $GITHUB_OUTPUT
          fi

      - name: Notify Google Chat
        if: steps.diff.outputs.no_changes != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_AUTOMATION }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::GOOGLE_CHAT_WEBHOOK_AUTOMATION not set, skipping notification"
            exit 0
          fi
          ACTION='${{ steps.pr.outputs.action }}'
          URL='${{ steps.pr.outputs.url }}'
          NUM='${{ steps.pr.outputs.number }}'
          COMMITS='${{ steps.diff.outputs.commits }}'
          FILES='${{ steps.diff.outputs.files }}'
          DATE='${{ steps.diff.outputs.date }}'
          ICON='🚀'
          if [ "$ACTION" = "updated" ]; then ICON='🔁'; fi

          BODY=$(jq -n \
            --arg text "$ICON *Release PR ${ACTION}*: <${URL}|#${NUM} Release ${DATE}>"$'\n'"${COMMITS} commits, ${FILES} files changed since last release." \
            '{text: $text}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK_URL" > /dev/null
          echo "Notification posted"

      - name: Notify Google Chat (no changes)
        if: steps.diff.outputs.no_changes == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_AUTOMATION }}
        run: |
          # Only notify on no-change for manual runs; the weekly cron staying
          # silent on no-change is intentional (less noise).
          if [ '${{ github.event_name }}' != 'workflow_dispatch' ]; then exit 0; fi
          if [ -z "$WEBHOOK_URL" ]; then exit 0; fi
          BODY=$(jq -n '{text: "ℹ️ *Release PR check*: staging is not ahead of main, nothing to release."}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK_URL" > /dev/null

      - name: Notify Google Chat -- failed
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_AUTOMATION }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(jq -n --arg text "❌ *Weekly release PR workflow FAILED*"$'\n'"<${RUN_URL}|View run logs>" '{text: $text}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK_URL" > /dev/null

      - name: Summary
        if: always()
        run: |
          echo "## Release PR Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.diff.outputs.no_changes }}" = "true" ]; then
            echo "- staging is not ahead of main; nothing to release." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Commits: ${{ steps.diff.outputs.commits }}" >> $GITHUB_STEP_SUMMARY
            echo "- Files changed: ${{ steps.diff.outputs.files }}" >> $GITHUB_STEP_SUMMARY
            echo "- PR action: ${{ steps.pr.outputs.action }}" >> $GITHUB_STEP_SUMMARY
            echo "- PR: ${{ steps.pr.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          fi
