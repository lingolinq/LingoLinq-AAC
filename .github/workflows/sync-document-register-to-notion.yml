name: Sync document register to Notion

# Keeps the "LingoLinq Compliance Documents (LL)" Notion board in sync with the SSOT
# (audit-reports/DOCUMENT-REGISTER.json) whenever the register changes on staging. One-way:
# register -> Notion. Only writes register-owned columns; human-owned columns (Program notes,
# Needs Scot decision) are never touched. The register is PII-free (titles, paths/URLs, hashes)
# -- Tier 2 content, no identifiers.
#
# Guarded on the NOTION_DOCS_DB_ID repo variable: the job is a no-op when it is unset. The
# variable is set and the sync is live (last success 2026-09-08). To point it at a different
# board: create the Notion DB with the schema in document-register-notion-sync.rb, share it
# with the COMPLIANCE API integration, and update the variable. NOTION_TOKEN is shared with
# the findings sync.

on:
  push:
    branches: [staging]
    paths:
      - 'audit-reports/DOCUMENT-REGISTER.json'
  workflow_dispatch: {}

concurrency:
  group: notion-document-register-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.NOTION_DOCS_DB_ID != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.3'
          bundler-cache: false
      - name: Sync register -> Notion documents board
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DOCS_DB_ID: ${{ vars.NOTION_DOCS_DB_ID }}
        run: ruby scripts/document-register-notion-sync.rb --prune
