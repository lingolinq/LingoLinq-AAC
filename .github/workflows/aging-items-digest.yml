name: Aging Items Digest

on:
  schedule:
    # Daily at 15:00 UTC (08:00 PT)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  aging-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Run Aging Digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_AUTOMATION: ${{ secrets.GOOGLE_CHAT_WEBHOOK_AUTOMATION }}
        run: |
          chmod +x scripts/aging_digest.rb
          ./scripts/aging_digest.rb
