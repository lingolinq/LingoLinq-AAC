name: Data-bearing paths

# Merge gate for real user data (brain issue 233). A PR that adds or changes a fixture,
# factory, seed, migration, VCR cassette, data rake task, data file or db/language/
# path, any file under .github/workflows/, or this check's own files fails until a
# reviewer with write access confirms the data is synthetic and adds the
# `synthetic-data` label. That records an approval as a commit status on the PR's
# current head commit, named for the PR and its base
# (data-bearing-approval/pr-<n>/<base>), and the label is removed. A later push is a
# new commit with no approval, so the reviewer adds the label again for it.
#
# The verdict is posted as a commit status on the head, data-bearing-paths/<base>.
#
# Rollout: require the data-bearing-paths/develop, /staging and /main status contexts
# on their branches, with the source pinned to GitHub Actions, and run the canary
# before relying on it (a code-only PR, a fixture PR approved by the label, a push
# after approval, a label from a read-only account, and a PR adding its own workflow).
# The canary also confirms this workflow's token can read a collaborator's permission.
#
# What it does and does not do: it keeps real data out of develop, staging and main
# and flags it when a PR is opened or updated. This repo is public, so a pushed branch
# is already published; the check cannot unpublish it, and the author's own look
# before pushing comes first. Ruleset bypass actors can merge past a required check.
# A fork PR's token cannot post statuses, but a workflow in a same-repo PR can, as
# github-actions[bot], so anyone with write access can get past this check: it guards
# against mistakes and fork PRs, not against a collaborator set on bypassing it.
# After force-pushing a base branch (to scrub data, say), re-run this check on every
# open PR to that base: a PR that went green before the force-push stays green until
# its check runs again.
#
# WHY pull_request_target: it runs THIS file and the scripts from the repository's
# default branch (develop), for PRs to staging and main too (GitHub, since
# 2025-12-08), so a PR cannot edit the check that judges it; a change to the check
# takes effect only after it merges to develop. It is safe here because nothing from
# the PR is executed: the PR's commits are fetched as data and read with git diff,
# git diff-tree and git rev-list. Do not add a step that checks out, builds or runs PR
# code, and do not add secrets: this trigger runs for fork PRs with the base
# repository's token, which here can post statuses and remove the label.
# Bootstrap: this workflow runs only once it is on develop.

on:
  pull_request_target:
    branches: [ develop, staging, main ]
    # edited covers a PR retargeted after it was opened; labeled records an approval.
    types: [ opened, synchronize, reopened, ready_for_review, edited, labeled ]

permissions:
  contents: read
  # write: post the approval and verdict statuses on the head commit.
  statuses: write
  # write: remove the synthetic-data label once its approval is recorded.
  pull-requests: write

jobs:
  data-bearing-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One queue per PR, nothing cancelled or dropped (up to 100 pending), so runs post
    # in the order they were queued. Each run decides only for the PR's current head.
    concurrency:
      group: data-bearing-paths-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      # A run whose head has already moved on skips the clone and the harness; the
      # script makes the same comparison again and posts nothing for a moved head. A
      # labeled run always continues, so its label is handled. A failed lookup
      # continues too, and the script then fails closed.
      - name: Skip a run whose head has moved on
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          current=true
          if [ "$EVENT_ACTION" != labeled ]; then
            live="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)"
            if [ -n "$live" ] && [ "$live" != "$EVENT_HEAD_SHA" ]; then
              current=false
              echo "The PR head moved to $live; the run for that head decides."
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      # The default branch (pull_request_target's ref), with full history so the
      # merge bases resolve. The script fetches the live base branches itself.
      - name: Checkout the default branch (trusted scripts)
        if: steps.live.outputs.current == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR's commits, as data only. Nothing from them is checked out or run.
      - name: Fetch the PR's commits (data only)
        if: steps.live.outputs.current == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Parse-check the check and its test harness
        if: steps.live.outputs.current == 'true'
        run: bash -n scripts/data-bearing-path-check.sh && bash -n scripts/data-bearing-path-check-ci.sh && bash -n scripts/tests/data-bearing-path-check-test.sh && bash -n scripts/codex-review-path-classifier.sh

      # Prove the check and its classifier fire before trusting the verdict on this PR.
      - name: Verify the data-bearing path check actually fires
        if: steps.live.outputs.current == 'true'
        run: bash scripts/tests/codex-review-path-classifier-test.sh && bash scripts/tests/data-bearing-path-check-test.sh

      # Event fields reach the script through env, never inline in run.
      - name: Data-bearing path check
        if: steps.live.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/data-bearing-path-check-ci.sh
